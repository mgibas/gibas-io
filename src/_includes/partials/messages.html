{% import "partials/buttons.html" as buttons %} {% macro success(title, copy, backURL) %}
<div
  class="not-prose relative mx-auto max-w-md overflow-hidden rounded-lg border border-gray-50 px-8 py-6 text-left shadow-xl dark:border-0 dark:bg-gray-600 dark:shadow-gray-800">
  <div
    class="mx-auto flex h-12 w-12 items-center justify-center rounded-full border border-green-300 bg-green-50 dark:border-green-700 dark:bg-green-900 dark:bg-opacity-50">
    <svg
      class="h-6 w-6 text-green-600 dark:text-green-400"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
    </svg>
  </div>
  <div class="mt-3 text-center sm:mt-5">
    <h3 class="text-lg font-medium leading-6 text-heading dark:text-dark-heading" id="modal-title">{{title}}</h3>
    <div class="mt-2">
      <p class="text-sm text-secondary dark:text-dark-primary">{{copy}}</p>
    </div>
  </div>
  <div class="mt-5 sm:mt-6">{% call buttons.primary(tag='a', href=backURL) -%}Go back{%- endcall %}</div>
</div>
{% endmacro %}
