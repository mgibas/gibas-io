<header class="grid min-h-screen place-content-center">
  <div class="relative pb-[72px] sm:pb-12">
    <h1 class="text-4xl font-extrabold tracking-tight sm:text-5xl md:text-6xl">Maciej Gibas</h1>
    <h2
      class="absolute bottom-0 left-0 grid gap-x-2 text-2xl font-semibold uppercase tracking-tight text-gray-600 dark:text-gray-300 sm:grid-flow-col sm:text-3xl md:text-4xl"
      role="img"
      aria-label="Frontend leader, architect, developer, designer">
      <span class="col-span-2 whitespace-nowrap" aria-hidden="true">Frontend</span>
      <span class="whitespace-nowrap" aria-hidden="true">
        <span
          class="bg-gradient-to-r from-rose-400 to-rose-600 bg-clip-text text-transparent"
          x-data="rolesTyper(['leader', 'architect', 'developer', 'designer'])"
          x-init="setTimeout(() => erase(), 3000)">
          <template x-for="char in role"><span x-text="char"></span></template>
        </span>
        <span class="animate-cursor">_</span>
      </span>
    </h2>
  </div>

  <div>
    <ul class="mt-3 flex space-x-6">
      {% for link in social %}
      <li>
        <a
          href="{{link.url}}"
          class="transition-color text-gray-300 transition-colors hover:text-gray-600 dark:text-gray-600 dark:hover:text-gray-300"
          target="_blank"
          rel="noopener noreferrer">
          <span class="sr-only">{{link.name}}</span>
          {{ link.icon | svgContents('w-6 h-6 transition-transform hover:rotate-12') | safe }}
        </a>
      </li>
      {% endfor %}
    </ul>
  </div>
</header>

{% block scripts %}
<script>
  const rolesTyper = (roles) => {
    const randomTimeout = (from, to) => Math.floor(Math.random() * to) + from

    return {
      role: roles[0].split(''),
      current: 0,
      erase() {
        this.role
          .reduce((promise, char) => {
            return promise.then(() => {
              return new Promise((res) => setTimeout(() => res(this.role.pop()), randomTimeout(40, 60)))
            })
          }, Promise.resolve())
          .then(() => setTimeout(() => this.type(), 1000))
      },
      type() {
        this.current = this.current + 1 === roles.length ? 0 : this.current + 1
        const role = roles[this.current].split('')

        role
          .reduce((promise, char) => {
            return promise.then(() => {
              return new Promise((res) => setTimeout(() => res(this.role.push(char)), randomTimeout(90, 150)))
            })
          }, Promise.resolve())
          .then(() => setTimeout(() => this.erase(), 3000))
      },
    }
  }
</script>
{% endblock %}
