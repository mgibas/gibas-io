name: 'Chromatic'

on: push

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      uid_gid: ${{ steps.get-user.outputs.uid_gid }}
    steps:
      - id: get-user
        run: echo "::set-output name=uid_gid::$(id -u):$(id -g)"

  test-gibas-io:
    runs-on: ubuntu-latest
    needs: [configure]
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-jammy
      options: --user ${{ needs.configure.outputs.uid_gid }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm install
      - name: Run Playwright tests
        run: pnpm --filter @gibas/gibas.io test
      - name: Upload test results
        uses: chromaui/action@latest
        with:
          playwright: true
          projectToken: ${{ secrets.CHROMATIC_TOKEN_GIBAS_IO }}
        env:
          CHROMATIC_ARCHIVE_LOCATION: ./apps/gibas.io/test-results/

  test-ce-gibas-io:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-jammy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm install
      - name: Run Playwright tests
        run: pnpm --filter @gibas/ce.gibas.io test
      - name: Upload test results
        uses: chromaui/action@latest
        with:
          playwright: true
          projectToken: ${{ secrets.CHROMATIC_TOKEN_GIBAS_IO }}
        env:
          CHROMATIC_ARCHIVE_LOCATION: ./apps/ce.gibas.io/test-results/
