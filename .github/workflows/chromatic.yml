name: 'Chromatic'

on: push

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      uid_gid: ${{ steps.get-user.outputs.uid_gid }}
    steps:
      - id: get-user
        run: echo "uid_gid=$(id -u):$(id -g)" >> $GITHUB_OUTPUT

  test-gibas-io:
    runs-on: ubuntu-latest
    needs: [configure]
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-jammy
      options: --user ${{ needs.configure.outputs.uid_gid }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm --filter @gibas/ibas.io build
      - name: Run Playwright tests
        run: pnpm --filter @gibas/gibas.io test
      - name: Upload test results
        uses: chromaui/action@latest
        with:
          playwright: true
          workingDir: apps/gibas.io
          projectToken: ${{ secrets.CHROMATIC_TOKEN_GIBAS_IO }}

  test-ce-gibas-io:
    runs-on: ubuntu-latest
    needs: [configure]
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-jammy
      options: --user ${{ needs.configure.outputs.uid_gid }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm --filter @gibas/ce.gibas.io build
      - name: Run Playwright tests
        run: pnpm --filter @gibas/ce.gibas.io test
      - name: Upload test results
        uses: chromaui/action@latest
        with:
          playwright: true
          workingDir: apps/ce.gibas.io
          projectToken: ${{ secrets.CHROMATIC_TOKEN_CE_GIBAS_IO }}
