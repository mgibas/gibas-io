name: 'Chromatic'

on: push

jobs:
  test-gibas-io:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-jammy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm install
      - name: Change directory
        run: cd apps/gibas.io
      - name: Run Playwright tests
        run: pnpm test
      - name: Upload test results
        uses: chromaui/action@latest
        with:
          playwright: true
          projectToken: ${{ secrets.CHROMATIC_TOKEN_GIBAS_IO }}

  test-ce-gibas-io:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-jammy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm install
      - name: Change directory
        run: cd apps/ce.gibas.io
      - name: Run Playwright tests
        run: pnpm test
      - name: Upload test results
        uses: chromaui/action@latest
        with:
          playwright: true
          projectToken: ${{ secrets.CHROMATIC_TOKEN_GIBAS_IO }}
